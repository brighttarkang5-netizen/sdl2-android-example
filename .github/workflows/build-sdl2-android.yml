name: build-and-release

on:
  push:
    branches:
      - master

jobs:
  build-creator:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: DD-MM-YYYY

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        env:
          # THIS IS THE MAGIC LINE FOR 2026 ERRORS
          SKIP_JDK_VERSION_CHECK: 'true' 
        with:
          packages: "ndk;21.4.7075529"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
         ./gradlew assembleRelease \
         -x lint \
         -Pandroid.ndkPath=$ANDROID_SDK_ROOT/ndk/21.4.7075529
 
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Auto Build ${{ steps.current-time.outputs.formattedTime }}"
          tag_name: "v${{ github.run_number }}-${{ steps.current-time.outputs.formattedTime }}"
          prerelease: true
          body: "Automatic build generated on ${{ steps.current-time.outputs.formattedTime }}."
          files: |
            ./app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
