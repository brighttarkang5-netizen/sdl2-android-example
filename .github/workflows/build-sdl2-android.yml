name: build-and-release

on:
  push:
    branches:
      - master

jobs:
  build-creator:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------
      # Checkout repository
      # ------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------
      # Get current time
      # ------------------------------------
      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: DD-MM-YYYY

      # ------------------------------------
      # Java 17 (ONLY for SDK tools)
      # ------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------
      # Install Android SDK + NDK + CMake
      # ------------------------------------
      - name: Setup Android SDK & NDK
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /usr/local/lib/android/sdk/cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip
          mv cmdline-tools latest

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      # ------------------------------------
      # Java 11 for Gradle 6.x
      # ------------------------------------
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # ------------------------------------
      # Clean old builds
      # ------------------------------------
      - name: Clean old builds
        run: |
          rm -rf app/build
          rm -rf .gradle

      # ------------------------------------
      # Build Debug APK
      # ------------------------------------
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug -x lint

      # ------------------------------------
      # Upload APK
      # ------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
