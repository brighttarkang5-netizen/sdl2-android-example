name: build-and-release

on:
  push:
    branches:
      - master

jobs:
  build-creator:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: DD-MM-YYYY

      # ------------------------------------
      # Java 17 (ONLY for Android SDK tools)
      # ------------------------------------
      - name: Setup Java 17 (Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------
      # Install Android SDK + NDK 21
      # ------------------------------------
      - name: Setup Android SDK & NDK
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /usr/local/lib/android/sdk/cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip
          mv cmdline-tools latest

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"   # <-- ADD THIS LINE ONLY

      # ------------------------------------
      # Switch BACK to Java 11 (Gradle 6.x)
      # ------------------------------------
      - name: Setup Java 11 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # ------------------------------------
      # Kill conflicting NDK env vars
      # ------------------------------------
      - name: Clear conflicting NDK env vars
        run: |
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT

      # ------------------------------------
      # Force correct NDK + CMake paths
      # ------------------------------------
      - name: Force correct NDK & CMake paths
        run: |
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/21.4.7075529" > local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.10.2.4988404" >> local.properties

      # ------------------------------------
      # Build APK
      # ------------------------------------
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew clean assembleRelease -x lint
          
      - name: Build Debug APK (installs on phone)
        run: |
          ./gradlew assembleDebug -x lint
    
      # ------------------------------------
      # Create GitHub Release
      # ------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Auto Build ${{ steps.current-time.outputs.formattedTime }}"
          tag_name: "v${{ github.run_number }}-${{ steps.current-time.outputs.formattedTime }}"
          prerelease: true
          body: "Automatic build generated on ${{ steps.current-time.outputs.formattedTime }}."
          files: |
            ./app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
