name: build-and-release

on:
  push:
    branches:
      - master

jobs:
  build-creator:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated from v2

      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: DD-MM-YYYY

      - name: Setup Java Environment
        uses: actions/setup-java@v4 # Updated from v2
        with:
          distribution: 'temurin' # adopt-hotspot is deprecated; temurin is the successor
          java-version: '11'
          cache: 'gradle' # This handles caching properly and safely

      - name: Building with Gradle
        uses: gradle/actions/setup-gradle@v3 # Replaced old eskatos action
        with:
          gradle-version: 6.9
          arguments: 'build -x lint'

      - name: Upload APK Files to Release
        uses: softprops/action-gh-release@v2 # Updated from v1
        with:
          name: "Auto Build ${{ steps.current-time.outputs.formattedTime }}"
          tag_name: "build-${{ github.run_number }}" # Added dynamic tag to prevent release conflicts
          prerelease: true
          body: |
            This is an Automatic Release by GitHub Actions.
            APK marked "unsigned" needs to be signed with test key before installing.
          files: |
            ./app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
