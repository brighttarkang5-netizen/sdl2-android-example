name: build-and-release

on:
  push:
    branches:
      - master

jobs:
  build-creator:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: DD-MM-YYYY

      # -------------------------------
      # Java 17 (ONLY for Android SDK)
      # -------------------------------
      - name: Setup Java 17 (Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -------------------------------
      # Install Android SDK + NDK
      # -------------------------------
      - name: Setup Android SDK & NDK
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /usr/local/lib/android/sdk/cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip
          mv cmdline-tools latest

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      # -------------------------------
      # Switch BACK to Java 11
      # (Gradle 6.9 compatibility)
      # -------------------------------
      - name: Setup Java 11 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # -------------------------------
      # Build APK
      # -------------------------------
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleRelease \
            -x lint \
            -Pandroid.ndkPath=$ANDROID_SDK_ROOT/ndk/21.4.7075529

      # -------------------------------
      # Create GitHub Release
      # -------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Auto Build ${{ steps.current-time.outputs.formattedTime }}"
          tag_name: "v${{ github.run_number }}-${{ steps.current-time.outputs.formattedTime }}"
          prerelease: true
          body: "Automatic build generated on ${{ steps.current-time.outputs.formattedTime }}."
          files: |
            ./app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
